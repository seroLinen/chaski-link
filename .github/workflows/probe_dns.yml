name: Probe DNS candidates (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Probe TCP 53
      run: |
        python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import socket, time
        cands = {
         "Google_DNS":"8.8.8.8", "Cloudflare_DNS":"1.1.1.1", "Quad9_DNS":"9.9.9.9",
         "OpenDNS":"208.67.222.222", "AdGuard_DNS":"94.140.14.14", "Level3_DNS":"4.2.2.1",
         "Cloudflare_Secondary":"1.0.0.1", "Google_Secondary":"8.8.4.4", "Quad9_Secondary":"149.112.112.112",
        }
        print("| name | ip | result |\n|---|---|---|")
        for n, ip in cands.items():
            res = []
            for _ in range(3):
                t = time.time()
                try:
                    socket.create_connection((ip, 53), timeout=3).close()
                    res.append(f"{(time.time()-t)*1000:.1f}ms")
                except Exception as e:
                    res.append(type(e).__name__)
            print(f"| {n} | {ip} | {' / '.join(res)} |")
        PY
