name: Network Health Check

on:
  schedule:
    # Runs every 30 minutes, around the clock (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # This lets you trigger it manually from the GitHub website

permissions:
  contents: write # Required so the commit step can push the updated log/graph
  issues: write   # Required so incident alerts can open and close GitHub issues

# Never let two runs overlap: they both append to the same CSV files,
# so a second run waits for the first instead of racing it to the push.
concurrency:
  group: network-health-check
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04 # pinned so a runner image change can't surprise the monitor
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Chaski-Link Monitor
      run: python monitor.py

    - name: Run Latency Analysis
      run: python analyze.py

    - name: Generate Status Dashboard
      run: python dashboard.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add network_log.csv latency_report.png incidents.csv status.html
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Chaski-Link: Automated Update [Skip CI]"
          git pull --rebase origin main
          git push
        fi

    # After the commit, so the log is always saved even if an alert fails.
    # Opens a GitHub issue when an incident starts and closes it on recovery;
    # GitHub emails you for new issues like any other repo notification.
    - name: Notify on incident changes
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/notify_incidents.sh
