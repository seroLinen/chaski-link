name: Daily Network Health Check

on:
  schedule:
    # Runs every 30 minutes, around the clock (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # This lets you trigger it manually from the GitHub website

permissions:
  contents: write # Required so the final step can push the updated log/graph

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Chaski-Link Monitor
      run: python monitor.py

    - name: Run Latency Analysis
      run: python analyze.py

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add network_log.csv latency_report.png
        git commit -m "Chaski-Link: Automated Daily Update & Graph [Skip CI]" || echo "No changes to commit"
        git push